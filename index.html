<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#090307" />

    <title>Điều em muốn nói ❤️</title>

    <style>
        /* =====================================================
       RESET
    ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(circle at center,
                    #421326 0%,
                    #1b0710 45%,
                    #050205 100%);

            color: #fff;

            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }


        /* =====================================================
       BACKGROUND GLOW
    ===================================================== */

        body::before {
            content: "";

            position: fixed;

            width: 80vmax;
            height: 80vmax;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(255, 45, 105, 0.12),
                    transparent 65%);

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
       FALLING BACKGROUND TEXT
    ===================================================== */

        #falling-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }

        .falling-text {
            position: absolute;

            top: -60px;

            white-space: nowrap;

            color:
                rgba(255, 120, 160, 0.22);

            font-size:
                clamp(13px,
                    1.8vw,
                    22px);

            font-weight: 600;

            letter-spacing: 0.3px;

            text-shadow:
                0 0 8px rgba(255, 70, 130, 0.35);

            animation:
                falling linear forwards;

            will-change:
                transform,
                opacity;
        }

        @keyframes falling {

            0% {
                transform:
                    translate3d(0,
                        -10vh,
                        0) rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform:
                    translate3d(30px,
                        120vh,
                        0) rotate(12deg);

                opacity: 0;
            }
        }


        /* =====================================================
       MAIN
    ===================================================== */

        #main {
            position: relative;

            width: 100%;
            height: 100%;

            min-height: 100svh;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 10;

            padding:
                env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }


        /* =====================================================
       START SCREEN
    ===================================================== */

        #start-screen {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            background:
                radial-gradient(circle at center,
                    #3f1025 0%,
                    #190610 45%,
                    #090307 100%);
        }

        #start-screen::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background:
                rgba(255,
                    51,
                    102,
                    0.12);

            filter: blur(60px);

            pointer-events: none;
        }

        #start-content {
            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        #start-icon {
            font-size:
                clamp(45px,
                    10vw,
                    75px);

            margin-bottom: 15px;

            animation:
                floatingHeart 2s ease-in-out infinite;
        }

        @keyframes floatingHeart {

            0%,
            100% {
                transform:
                    translateY(0) scale(1);
            }

            50% {
                transform:
                    translateY(-8px) scale(1.06);
            }
        }

        #start-screen h1 {

            max-width: 90vw;

            margin-bottom: 12px;

            font-size:
                clamp(27px,
                    6vw,
                    52px);

            line-height: 1.2;

            font-weight: 800;
        }

        #start-screen p {

            max-width: 500px;

            margin-bottom: 30px;

            color:
                rgba(255,
                    255,
                    255,
                    0.65);

            font-size:
                clamp(15px,
                    3vw,
                    19px);

            line-height: 1.5;
        }

        #start-btn {

            border: none;

            min-height: 54px;

            padding:
                14px 32px;

            border-radius: 50px;

            background:
                linear-gradient(135deg,
                    #ff3366,
                    #ff6b9d);

            color: #fff;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(255,
                    51,
                    102,
                    0.5),
                0 0 50px rgba(255,
                    51,
                    102,
                    0.2);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        #start-btn:hover {

            transform:
                scale(1.06);

            box-shadow:
                0 0 30px rgba(255,
                    51,
                    102,
                    0.7),
                0 0 70px rgba(255,
                    51,
                    102,
                    0.3);
        }

        #start-btn:active {

            transform:
                scale(0.95);
        }

        #start-btn:disabled {

            opacity: 0.75;

            cursor: default;
        }


        /* =====================================================
       MESSAGE SEQUENCE
    ===================================================== */

        #message-section {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;

            position: relative;

            z-index: 5;
        }

        #message {

            max-width: 90%;

            font-size:
                clamp(25px,
                    6vw,
                    52px);

            line-height: 1.25;

            font-weight: 800;

            letter-spacing: 0.2px;

            text-shadow:
                0 0 10px rgba(255,
                    255,
                    255,
                    0.45),
                0 0 25px rgba(255,
                    80,
                    140,
                    0.35);
        }


        /* =====================================================
       WORD-BY-WORD REVEAL

       Each message is split into <span class="word"> pieces
       by JS. They stagger in individually; the whole line
       leaves together (see .message-leave below).
    ===================================================== */

        #message .word {

            display: inline-block;

            opacity: 0;

            transform:
                translateY(16px) scale(.94);

            filter:
                blur(6px);

            animation:
                wordIn .7s cubic-bezier(.17,
                    .67,
                    .32,
                    1) forwards;

            animation-delay:
                calc(var(--i) * 60ms);
        }

        @keyframes wordIn {

            to {

                opacity: 1;

                transform:
                    translateY(0) scale(1);

                filter:
                    blur(0);
            }
        }


        /* Soft glow breath once the line has fully landed */

        .message-shimmer {

            animation:
                messageShimmer 1.4s ease;
        }

        @keyframes messageShimmer {

            0%,
            100% {

                text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.45),
                    0 0 25px rgba(255, 80, 140, 0.35);
            }

            50% {

                text-shadow:
                    0 0 18px rgba(255, 255, 255, 0.85),
                    0 0 42px rgba(255, 120, 170, 0.6);
            }
        }


        /* Message leaving */

        .message-leave {

            animation:
                messageLeave .8s ease forwards;
        }

        @keyframes messageLeave {

            0% {

                opacity: 1;

                transform:
                    translateY(0) scale(1);

                filter:
                    blur(0);
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-25px) scale(1.08);

                filter:
                    blur(8px);
            }
        }


        /* =====================================================
       FINAL SECTION
    ===================================================== */

        #final-section {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            overflow: hidden;

            z-index: 20;
        }


        /* =====================================================
       HEART
    ===================================================== */

        .heart-wrapper {

            position: relative;

            width:
                clamp(190px,
                    38vw,
                    280px);

            height:
                clamp(175px,
                    35vw,
                    260px);

            flex-shrink: 0;

            animation:
                heartAppear 1.5s cubic-bezier(.17,
                    .67,
                    .32,
                    1.5) forwards;
        }

        .heart {

            position: absolute;

            width:
                clamp(110px,
                    23vw,
                    165px);

            height:
                clamp(110px,
                    23vw,
                    165px);

            left: 50%;
            top: 50%;

            background:
                #ff3366;

            transform:
                translate(-50%, -50%) rotate(-45deg);

            border-radius:
                8px 0 8px 0;

            box-shadow:
                0 0 20px #ff3366,
                0 0 50px rgba(255,
                    51,
                    102,
                    .8),
                0 0 100px rgba(255,
                    51,
                    102,
                    .5);

            animation:
                heartbeat 1s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {

            content: "";

            position: absolute;

            width: 100%;
            height: 100%;

            background:
                #ff3366;

            border-radius: 50%;
        }

        .heart::before {

            top: -50%;

            left: 0;
        }

        .heart::after {

            top: 0;

            left: 50%;
        }

        @keyframes heartAppear {

            0% {

                transform:
                    scale(0) rotate(-20deg);

                opacity: 0;
            }

            70% {

                transform:
                    scale(1.15) rotate(5deg);
            }

            100% {

                transform:
                    scale(1) rotate(0);

                opacity: 1;
            }
        }

        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    translate(-50%, -50%) rotate(-45deg) scale(1);
            }

            50% {

                transform:
                    translate(-50%, -50%) rotate(-45deg) scale(1.08);
            }
        }


        /* =====================================================
       FINAL MESSAGE
    ===================================================== */

        #final-message {

            position: relative;

            z-index: 30;

            width: 100%;

            max-width: 92%;

            margin-top: 5px;

            font-size:
                clamp(25px,
                    6vw,
                    50px);

            line-height: 1.25;

            font-weight: 800;

            color: #fff;

            text-shadow:
                0 0 10px rgba(255,
                    255,
                    255,
                    .7),
                0 0 25px rgba(255,
                    100,
                    150,
                    .8);

            opacity: 0;

            animation:
                finalText 1.5s ease 1s forwards;
        }

        @keyframes finalText {

            from {

                opacity: 0;

                transform:
                    translateY(30px) scale(.9);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }
        }


        /* =====================================================
       FINAL SUBTEXT
    ===================================================== */

        #final-subtext {

            position: relative;

            z-index: 30;

            max-width: 500px;

            margin-top: 12px;

            color:
                rgba(255,
                    255,
                    255,
                    .65);

            font-size:
                clamp(14px,
                    3vw,
                    18px);

            line-height: 1.5;

            opacity: 0;

            animation:
                finalSubtext 1.2s ease 1.4s forwards;
        }

        @keyframes finalSubtext {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
       SPARKLE
    ===================================================== */

        .sparkle {

            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #fff;

            z-index: 50;

            pointer-events: none;

            box-shadow:
                0 0 8px #fff,
                0 0 15px rgba(255,
                    100,
                    150,
                    .8);

            animation:
                sparkle 1.5s ease-out forwards;
        }

        @keyframes sparkle {

            0% {

                transform:
                    translate(0, 0) scale(0);

                opacity: 1;
            }

            15% {

                transform:
                    translate(0, 0) scale(1);
            }

            100% {

                transform:
                    translate(var(--x),
                        var(--y)) scale(0);

                opacity: 0;
            }
        }


        /* =====================================================
       FLASH
    ===================================================== */

        #flash {

            position: fixed;

            inset: 0;

            z-index: 80;

            background: #fff;

            pointer-events: none;

            opacity: 0;
        }

        .flash-active {

            animation:
                flashEffect .8s ease-out;
        }

        @keyframes flashEffect {

            0% {
                opacity: 0;
            }

            15% {
                opacity: .75;
            }

            100% {
                opacity: 0;
            }
        }


        /* =====================================================
       AUDIO TOGGLE BUTTON
    ===================================================== */

        #audio-toggle {

            position: fixed;

            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));

            z-index: 200;

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;

            background: rgba(20, 8, 14, 0.55);

            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);

            color: #fff;

            font-size: 20px;
            line-height: 1;

            cursor: pointer;

            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                opacity 0.2s ease;
        }

        #audio-toggle:hover {

            transform: scale(1.08);

            background: rgba(255, 51, 102, 0.28);
        }

        #audio-toggle:active {

            transform: scale(0.92);
        }

        #audio-toggle.is-muted {

            opacity: 0.6;
        }


        /* =====================================================
       📱 PORTRAIT
    ===================================================== */

        @media (orientation: portrait) and (max-width: 600px) {

            #message-section {

                padding:
                    15px;
            }

            #message {

                max-width: 92%;

                font-size:
                    clamp(23px,
                        6.5vw,
                        38px);
            }

            #final-section {

                padding:
                    20px 15px;
            }

            .heart-wrapper {

                width: 210px;

                height: 195px;
            }

            .heart {

                width: 120px;

                height: 120px;
            }

            #final-message {

                max-width: 95%;

                font-size:
                    clamp(25px,
                        7vw,
                        40px);
            }

            #final-subtext {

                max-width: 90%;

                font-size: 15px;
            }

            .falling-text {

                font-size:
                    clamp(12px,
                        3.5vw,
                        17px);
            }
        }


        /* =====================================================
       📱 LANDSCAPE PHONE
    ===================================================== */

        @media (orientation: landscape) and (max-height: 600px) {

            #main {

                min-height: 100svh;
            }


            /* ---------------------------------------------
         MESSAGE
      --------------------------------------------- */

            #message-section {

                padding:
                    8px 30px;
            }

            #message {

                max-width: 90vw;

                font-size:
                    clamp(20px,
                        6vh,
                        36px);
            }


            /* ---------------------------------------------
         FINAL LANDSCAPE
      --------------------------------------------- */

            #final-section {

                flex-direction: row;

                justify-content: center;

                align-items: center;

                gap:
                    clamp(10px,
                        5vw,
                        60px);

                padding:
                    10px 5vw;
            }

            .heart-wrapper {

                width:
                    clamp(135px,
                        38vh,
                        210px);

                height:
                    clamp(125px,
                        35vh,
                        190px);
            }

            .heart {

                width:
                    clamp(80px,
                        21vh,
                        130px);

                height:
                    clamp(80px,
                        21vh,
                        130px);
            }

            #final-message {

                width: auto;

                max-width:
                    48vw;

                margin-top: 0;

                font-size:
                    clamp(21px,
                        5vh,
                        38px);

                line-height: 1.2;
            }

            #final-subtext {

                display: none;
            }


            /* ---------------------------------------------
         START SCREEN
      --------------------------------------------- */

            #start-screen {

                padding:
                    12px 30px;
            }

            #start-icon {

                font-size:
                    clamp(30px,
                        9vh,
                        50px);

                margin-bottom: 5px;
            }

            #start-screen h1 {

                margin-bottom: 5px;

                font-size:
                    clamp(21px,
                        6vh,
                        35px);
            }

            #start-screen p {

                margin-bottom: 15px;

                font-size:
                    clamp(13px,
                        3.5vh,
                        17px);
            }

            #start-btn {

                min-height: 44px;

                padding:
                    9px 25px;

                font-size: 16px;
            }


            /* ---------------------------------------------
         FALLING TEXT
      --------------------------------------------- */

            .falling-text {

                font-size:
                    clamp(12px,
                        3vh,
                        18px);
            }


            /* ---------------------------------------------
         AUDIO TOGGLE
      --------------------------------------------- */

            #audio-toggle {

                top: 8px;
                right: 8px;

                width: 36px;
                height: 36px;

                font-size: 16px;
            }
        }


        /* =====================================================
       📱 VERY SHORT LANDSCAPE
    ===================================================== */

        @media (orientation: landscape) and (max-height: 430px) {

            #message {

                font-size:
                    clamp(18px,
                        5vh,
                        28px);
            }

            #final-section {

                gap: 15px;

                padding:
                    5px 4vw;
            }

            .heart-wrapper {

                width: 125px;

                height: 115px;
            }

            .heart {

                width: 72px;

                height: 72px;
            }

            #final-message {

                max-width:
                    55vw;

                font-size:
                    clamp(18px,
                        5vh,
                        28px);
            }

            #start-screen p {

                display: none;
            }

            #start-screen h1 {

                margin-bottom: 12px;
            }
        }


        /* =====================================================
       📱 SMALL PHONE
    ===================================================== */

        @media (max-width: 380px) {

            #message {

                font-size: 22px;
            }

            .heart-wrapper {

                transform:
                    scale(.85);
            }

            #final-message {

                font-size: 25px;
            }
        }


        /* =====================================================
       SAFE AREA
    ===================================================== */

        @supports (padding: env(safe-area-inset-top)) {

            #start-screen {

                padding-top:
                    max(20px,
                        env(safe-area-inset-top));

                padding-bottom:
                    max(20px,
                        env(safe-area-inset-bottom));
            }
        }


        /* =====================================================
       REDUCED MOTION
    ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;
            }
        }
    </style>
</head>


<body>


    <!-- ===================================================
       START SCREEN
  ==================================================== -->

    <section id="start-screen">

        <div id="start-icon">
            💌
        </div>

        <h1>
            Có một điều em muốn nói với chị...
        </h1>

        <p>
            Em đã giữ điều này trong lòng<br>
            một thời gian rồi.
        </p>

        <button id="start-btn">
            Chạm để nghe em nói nhá ❤️
        </button>


    </section>


    <!-- ===================================================
       FALLING BACKGROUND
  ==================================================== -->

    <div id="falling-container"></div>


    <!-- ===================================================
       FLASH
  ==================================================== -->

    <div id="flash"></div>


    <!-- ===================================================
       AUDIO TOGGLE
  ==================================================== -->

    <button id="audio-toggle" type="button" aria-label="Bật/tắt nhạc nền" aria-pressed="false">
        🔊
    </button>


    <!-- ===================================================
       MAIN
  ==================================================== -->

    <main id="main">


        <!-- =================================================
         MESSAGE SEQUENCE
    ================================================== -->

        <section id="message-section">

            <div id="message"></div>

        </section>


        <!-- =================================================
         FINAL
    ================================================== -->

        <section id="final-section">


            <div class="heart-wrapper">

                <div class="heart"></div>

            </div>


            <div>

                <div id="final-message">
                    Làm người yêu mình nhé? ❤️
                </div>

                <div id="final-subtext">
                    Mình thật sự thích cậu rất nhiều.
                </div>

            </div>


        </section>

    </main>


    <script>

        /* =====================================================
           CONFIG
        ===================================================== */
        const CONFIG = {

            /*
             * Background falling text
             */
            fallingMessages: [

                "Em thích chị",
                "Thương chị",
                "Nhớ chị",
                "Nghĩ về chị",
                "Muốn gặp chị",
                "Chị thật đặc biệt",
                "❤️",
                "❤️",
                "❤️",
                "❤️",
                "❤️",
                "❤️"


            ],

            /*
             * Main messages
             */
            messages: [

                "Chị có biết không...",

                "Em có một điều muốn nói với chị",

                "Thật ra em đã để ý chị một thời gian rồi",

                "Ban đầu chỉ đơn giản là thấy chị dễ thương",

                "Rồi em bắt đầu thích những cuộc trò chuyện giữa hai đứa",

                "Thích những lúc được nghe chị kể chuyện",

                "Thích cả những khoảnh khắc rất bình thường khi có chị ở đó",

                "Có những ngày chỉ một tin nhắn của chị cũng làm em vui hơn",

                "Rồi em nhận ra mình bắt đầu mong chờ những điều nhỏ bé ấy",

                "Mong được gặp chị",

                "Mong được nói chuyện với chị",

                "Và đôi khi... chỉ đơn giản là muốn biết hôm nay chị thế nào",

                "Em cũng không nhớ chính xác từ khi nào",

                "Nhưng chị đã trở thành một người khá đặc biệt với em",

                "Em thích cảm giác khi ở cạnh chị",

                "Tự nhiên, thoải mái và vui",

                "Có lẽ vì vậy mà em muốn chúng ta gần nhau hơn một chút",

                "Em không muốn cứ đoán xem cảm giác này sẽ đi đến đâu",

                "Nên em quyết định nói thẳng với chị",

                "Em thích chị",

                "Và em muốn thử cùng chị bước thêm một bước",

                "Chị nghe em nhé..."

            ],

            /*
             * Final message
             */
            finalText:
                "Chị làm người yêu em nhé? ❤️",

            /*
             * Small text
             */
            finalSubtext:
                "Em thích chị, và em muốn chúng ta có một câu chuyện của riêng mình."
        };



        /* =====================================================
           DOM
        ===================================================== */

        const startScreen =
            document.getElementById(
                "start-screen"
            );

        const startButton =
            document.getElementById(
                "start-btn"
            );

        const fallingContainer =
            document.getElementById(
                "falling-container"
            );

        const messageSection =
            document.getElementById(
                "message-section"
            );

        const messageElement =
            document.getElementById(
                "message"
            );

        const finalSection =
            document.getElementById(
                "final-section"
            );

        const finalMessage =
            document.getElementById(
                "final-message"
            );

        const finalSubtext =
            document.getElementById(
                "final-subtext"
            );

        const flash =
            document.getElementById(
                "flash"
            );

        const audioToggle =
            document.getElementById(
                "audio-toggle"
            );


        /* =====================================================
           SET CONFIG
        ===================================================== */

        finalMessage.textContent =
            CONFIG.finalText;

        finalSubtext.textContent =
            CONFIG.finalSubtext;


        /* =====================================================
           AUDIO CONFIG
    
           Đổi src bên dưới nếu tên/đường dẫn file nhạc khác.
        ===================================================== */

        const AUDIO_CONFIG = {

            intro: {
                src: "assets/audio/intro.mp3",
                volume: 0.18
            },

            main: {
                src: "assets/audio/main.mp3",
                volume: 0.30,
                duckVolume: 0.22
            },

            fadeDuration: 1500

        };


        /* =====================================================
           AUDIO ELEMENTS
        ===================================================== */

        const introAudio = new Audio(AUDIO_CONFIG.intro.src);
        introAudio.loop = true;
        introAudio.preload = "auto";
        introAudio.volume = 0;

        const mainAudio = new Audio(AUDIO_CONFIG.main.src);
        mainAudio.loop = true;
        mainAudio.preload = "auto";
        mainAudio.volume = 0;

        let activeAudio = null;
        let isMuted = false;
        let introAudibleAt = null;


        /* =====================================================
           AUDIO HELPERS
        ===================================================== */

        function fadeAudio(audio, targetVolume, duration) {

            return new Promise(resolve => {

                if (audio._fadeTimer) {
                    clearInterval(audio._fadeTimer);
                    audio._fadeTimer = null;
                }

                const steps = Math.max(1, Math.round(duration / 50));
                const stepTime = duration / steps;
                const stepAmount = (targetVolume - audio.volume) / steps;

                let count = 0;

                audio._fadeTimer = setInterval(() => {

                    count++;

                    const next = audio.volume + stepAmount;

                    audio.volume = Math.min(1, Math.max(0, next));

                    if (count >= steps) {

                        clearInterval(audio._fadeTimer);
                        audio._fadeTimer = null;

                        audio.volume = Math.min(1, Math.max(0, targetVolume));

                        resolve();

                    }

                }, stepTime);

            });

        }

        function fadeOutAudio(audio, duration = AUDIO_CONFIG.fadeDuration) {

            return fadeAudio(audio, 0, duration).then(() => {

                audio.pause();

            });

        }

        function fadeInAudio(audio, targetVolume, duration = AUDIO_CONFIG.fadeDuration) {

            return fadeAudio(audio, targetVolume, duration);

        }

        function safePlay(audio) {

            try {

                const playPromise = audio.play();

                if (playPromise && typeof playPromise.catch === "function") {

                    playPromise.catch(() => {
                        /* Autoplay/playback blocked — fail silently, no page error */
                    });

                }

            } catch (err) {
                /* Playback unsupported — fail silently */
            }

        }

        function playIntro() {

            activeAudio = introAudio;

            if (introAudibleAt === null) {
                introAudibleAt = Date.now();
            }

            safePlay(introAudio);

            fadeInAudio(introAudio, AUDIO_CONFIG.intro.volume, 800);

        }

        function playMainMusic() {

            activeAudio = mainAudio;

            safePlay(mainAudio);

            fadeInAudio(mainAudio, AUDIO_CONFIG.main.volume, AUDIO_CONFIG.fadeDuration);

        }


        /* =====================================================
           AUDIO TRANSITION (intro -> main)
    
           The intro may already have been audible for a while
           (real autoplay succeeded, or it was unmuted on an
           earlier interaction) — or it may not have started at
           all yet. Either way, guarantee it gets at least a
           short MIN_INTRO_HOLD window of audible time before
           crossfading into the main track.
        ===================================================== */

        const MIN_INTRO_HOLD = 700;

        function startAudioTransition() {

            const introHasStarted =
                activeAudio === introAudio &&
                !introAudio.paused;

            if (!introHasStarted) {

                playIntro();

            } else if (introAudio.muted) {

                introAudio.muted = false;

            }

            /*
             * Start the main track now too, silently, using the
             * same click gesture — Safari/iOS requires play() to
             * happen inside the gesture, not inside a later timer.
             */

            activeAudio = mainAudio;
            mainAudio.volume = 0;
            safePlay(mainAudio);

            const elapsed =
                introAudibleAt === null
                    ? 0
                    : Date.now() - introAudibleAt;

            const introHoldTime =
                Math.max(0, MIN_INTRO_HOLD - elapsed);

            setTimeout(
                () => {

                    fadeOutAudio(introAudio, AUDIO_CONFIG.fadeDuration);

                    fadeInAudio(mainAudio, AUDIO_CONFIG.main.volume, AUDIO_CONFIG.fadeDuration);

                },
                introHoldTime
            );

        }


        /* =====================================================
           AUDIO MUTE TOGGLE
        ===================================================== */

        function updateAudioToggleUI() {

            audioToggle.textContent =
                isMuted ? "🔇" : "🔊";

            audioToggle.classList.toggle(
                "is-muted",
                isMuted
            );

            audioToggle.setAttribute(
                "aria-pressed",
                String(isMuted)
            );

        }

        audioToggle.addEventListener(
            "click",
            () => {

                isMuted = !isMuted;

                introAudio.muted = isMuted;
                mainAudio.muted = isMuted;

                updateAudioToggleUI();

            }
        );


        /* =====================================================
           INTRO AUTOPLAY ATTEMPT
    
           Real unmuted autoplay is blocked by almost every
           browser without a prior user gesture. As a fallback,
           start the intro MUTED right away (browsers always
           allow muted autoplay) so it's already running the
           instant the page opens — then unmute it on the very
           first interaction anywhere on the page, with no new
           gesture required since playback already started.
    
           Triggered on window "load" (all assets — images,
           audio metadata, etc. — finished loading) rather than
           as soon as the script runs.
        ===================================================== */

        function attemptIntroAutoplay() {

            try {

                const playPromise = introAudio.play();

                if (playPromise && typeof playPromise.then === "function") {

                    playPromise
                        .then(() => {

                            playIntro();

                        })
                        .catch(() => {

                            introAudio.muted = true;
                            introAudio.volume = 0;

                            safePlay(introAudio);

                        });

                }

            } catch (err) {
                /* Autoplay unsupported — safe to ignore */
            }

        }

        window.addEventListener(
            "load",
            attemptIntroAutoplay
        );


        /* =====================================================
           REVEAL INTRO ON FIRST INTERACTION
    
           If the browser blocked real autoplay, the intro is
           already playing muted in the background (see above).
           The instant the user touches the page in any way —
           not just the start button — unmute it so it feels
           like it was playing all along.
        ===================================================== */

        function revealIntroOnFirstInteraction() {

            if (activeAudio) {
                return;
            }

            if (introAudio.paused) {
                safePlay(introAudio);
            }

            introAudio.muted = false;

            activeAudio = introAudio;

            if (introAudibleAt === null) {
                introAudibleAt = Date.now();
            }

            fadeInAudio(introAudio, AUDIO_CONFIG.intro.volume, 500);

        }

        [
            "pointerdown",
            "touchstart",
            "keydown"
        ].forEach(eventName => {

            document.addEventListener(
                eventName,
                revealIntroOnFirstInteraction,
                {
                    once: true,
                    passive: true
                }
            );

        });


        /* =====================================================
           RANDOM
        ===================================================== */

        function random(min, max) {

            return (
                Math.random() *
                (max - min) +
                min
            );

        }


        /* =====================================================
           FALLING TEXT
        ===================================================== */

        function createFallingText() {

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "falling-text";


            /*
             * Random message
             */

            const index =
                Math.floor(
                    Math.random() *
                    CONFIG.fallingMessages.length
                );

            text.textContent =
                CONFIG.fallingMessages[index];


            /*
             * Position
             */

            text.style.left =
                random(0, 95) + "vw";


            /*
             * Size
             */

            text.style.fontSize =
                random(13, 21) + "px";


            /*
             * Duration
             */

            const duration =
                random(5, 10);

            text.style.animationDuration =
                duration + "s";


            /*
             * Delay
             */

            text.style.animationDelay =
                random(0, 1.5) + "s";


            /*
             * Add
             */

            fallingContainer.appendChild(
                text
            );


            /*
             * Remove
             */

            setTimeout(
                () => {

                    text.remove();

                },
                (duration + 2) * 1000
            );

        }


        /* =====================================================
           FALLING TEXT LOOP
        ===================================================== */

        let fallingInterval = null;


        function startFallingText() {

            if (fallingInterval) {
                return;
            }


            /*
             * Initial texts
             */

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                setTimeout(
                    createFallingText,
                    i * 180
                );

            }


            /*
             * Continue
             */

            fallingInterval =
                setInterval(
                    createFallingText,
                    350
                );

        }


        /* =====================================================
           DELAY
        ===================================================== */

        function delay(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );

        }


        /* =====================================================
           SHOW MESSAGE
        ===================================================== */

        async function showMessage(text) {

            /*
             * Remove old animation
             */

            messageElement.classList.remove(
                "message-leave",
                "message-shimmer"
            );


            /*
             * Force reflow
             */

            void messageElement.offsetWidth;


            /*
             * Split into words — each one gets its own
             * staggered reveal via the "word" span + --i
             */

            const words =
                text.split(" ");

            messageElement.innerHTML =
                words
                    .map(
                        (word, i) =>
                            `<span class="word" style="--i:${i}">${word}</span>`
                    )
                    .join(" ");


            /*
             * Soft glow breath once the words have landed
             */

            const wordsRevealedAt =
                (words.length - 1) * 60 + 700;

            setTimeout(
                () => {

                    messageElement.classList.add(
                        "message-shimmer"
                    );

                },
                wordsRevealedAt
            );


            /*
             * Stay on screen
             */

            await delay(3000);


            /*
             * Leave
             */

            messageElement.classList.remove(
                "message-shimmer"
            );

            void messageElement.offsetWidth;

            messageElement.classList.add(
                "message-leave"
            );


            /*
             * Wait for leave animation
             */

            await delay(850);

        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        function createSparkles() {

            const amount =
                window.innerWidth < 600
                    ? 50
                    : 75;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const sparkle =
                    document.createElement(
                        "div"
                    );

                sparkle.className =
                    "sparkle";


                /*
                 * Start from center
                 */

                sparkle.style.left =
                    "50vw";

                sparkle.style.top =
                    "50vh";


                /*
                 * Random direction
                 */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    random(100, 450);


                sparkle.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );


                sparkle.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                /*
                 * Random size
                 */

                const size =
                    random(3, 8);

                sparkle.style.width =
                    size + "px";

                sparkle.style.height =
                    size + "px";


                /*
                 * Random delay
                 */

                sparkle.style.animationDelay =
                    random(0, .25) + "s";


                document.body.appendChild(
                    sparkle
                );


                /*
                 * Cleanup
                 */

                setTimeout(
                    () => {

                        sparkle.remove();

                    },
                    1800
                );

            }

        }


        /* =====================================================
           FLASH
        ===================================================== */

        function createFlash() {

            flash.classList.remove(
                "flash-active"
            );


            void flash.offsetWidth;


            flash.classList.add(
                "flash-active"
            );

        }


        /* =====================================================
           FINAL SCENE
        ===================================================== */

        async function showFinalScene() {

            /*
             * Hide message
             */

            messageSection.style.display =
                "none";


            /*
             * Flash
             */

            createFlash();


            /*
             * Sparkle explosion
             */

            createSparkles();


            /*
             * Tiny pause
             */

            await delay(250);


            /*
             * Show heart
             */

            finalSection.style.display =
                "flex";


            /*
             * Warm the music back up as the final
             * text reveals itself (matches the CSS
             * finalText animation delay)
             */

            setTimeout(
                () => {

                    fadeInAudio(mainAudio, AUDIO_CONFIG.main.volume, 1400);

                },
                1000
            );

        }


        /* =====================================================
           START EXPERIENCE
        ===================================================== */

        async function startExperience() {

            /*
             * Hide start screen
             */

            startScreen.style.display =
                "none";


            /*
             * Start falling background
             */

            startFallingText();


            /*
             * Intro pause
             */

            await delay(500);


            /*
             * Show messages one by one
             */

            for (
                const text
                of CONFIG.messages
            ) {

                /*
                 * Emotional pause on the last line —
                 * duck the music down for a beat
                 */

                if (text === CONFIG.messages[CONFIG.messages.length - 1]) {

                    fadeAudio(mainAudio, AUDIO_CONFIG.main.duckVolume, 900);

                }

                await showMessage(text);

            }


            /*
             * Final scene
             */

            await showFinalScene();

        }


        /* =====================================================
           START BUTTON
        ===================================================== */

        startButton.addEventListener(
            "click",
            () => {

                /*
                 * 1. Disable button — prevent double click
                 */

                startButton.disabled = true;


                /*
                 * 2. Start audio transition
                 */

                startAudioTransition();


                /*
                 * 3. Start confession animation
                 *    (timing unchanged)
                 */

                startExperience();

            },
            {
                once: true
            }
        );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    if (
                        startScreen.style.display !==
                        "none"
                    ) {

                        startButton.click();

                    }

                }

            }
        );


        /* =====================================================
           PREVENT DOUBLE TAP ZOOM
        ===================================================== */

        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            event => {

                const now =
                    Date.now();

                if (
                    now - lastTouchEnd <= 300
                ) {

                    event.preventDefault();

                }

                lastTouchEnd = now;

            },
            {
                passive: false
            }
        );

    </script>

</body>
