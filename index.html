<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#090307" />

  <title>Điều em muốn nói ❤️</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>


<body>


  <!-- ===================================================
       START SCREEN
  ==================================================== -->

  <section id="start-screen">

    <div id="start-icon">
      💌
    </div>

    <h1>
      Có một điều em muốn nói với chị...
    </h1>

    <p>
      Em đã giữ điều này trong lòng<br>
      một thời gian rồi.
    </p>

    <button id="start-btn">
      Chạm để nghe em nói nhá ❤️
    </button>


  </section>


  <!-- ===================================================
       FALLING BACKGROUND
  ==================================================== -->

  <div id="falling-container"></div>


  <!-- ===================================================
       FLASH
  ==================================================== -->

  <div id="flash"></div>


  <!-- ===================================================
       AUDIO TOGGLE
  ==================================================== -->

  <button id="audio-toggle" type="button" aria-label="Bật/tắt nhạc nền" aria-pressed="false">
    🔊
  </button>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main id="main">


    <!-- =================================================
         MESSAGE SEQUENCE
    ================================================== -->

    <section id="message-section">

      <div id="message"></div>

    </section>


    <!-- =================================================
         FINAL
    ================================================== -->

    <section id="final-section">


      <div class="heart-wrapper">

        <div class="heart"></div>

      </div>


      <div>

        <div id="final-message">
          Làm người yêu mình nhé? ❤️
        </div>

        <div id="final-subtext">
          Mình thật sự thích cậu rất nhiều.
        </div>

      </div>


    </section>

  </main>


  <script type="module" src="js/main.js"></script>

</body>

</html>
